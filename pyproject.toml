[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uv5rm-channel-editor"
version = "1.0.0"
description = "Fast channel/zone editor for Baofeng UV-5RM Plus (GPS) .xlc codeplugs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Gabriele Cervellin" }]
keywords = ["baofeng", "uv-5rm", "5rh", "codeplug", "xlc", "ham-radio", "cps"]
classifiers = [
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Ham Radio",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.gui-scripts]
uv5rm-editor = "uv5rm_editor.editor:main"

[project.urls]
Homepage = "https://github.com/cervellingabriele/uv5rm-channel-editor"
Issues = "https://github.com/cervellingabriele/uv5rm-channel-editor/issues"

[tool.setuptools]
packages = ["uv5rm_editor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
